name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: llm_agent

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run --frozen --no-sync python -m compileall llm_agent tests automation

      - name: Lint
        run: >-
          uv run --frozen --no-sync ruff check
          llm_agent/demo
          llm_agent/demo_app.py
          llm_agent/application/audit
          llm_agent/infrastructure/audit
          llm_agent/api/http/audit_context.py
          llm_agent/api/http/v1/dto/demo_auth.py
          llm_agent/api/http/v1/routes/demo_auth.py
          llm_agent/infrastructure/mcp
          llm_agent/services/demo
          llm_agent/api/http/v1/dto/demo.py
          llm_agent/api/http/v1/routes/demo.py
          llm_agent/core/telemetry.py
          tests/fake_implementations/demo_mcp_client.py
          tests/unit/demo
          tests/thin_integration/demo
          automation

      - name: Check formatting
        run: >-
          uv run --frozen --no-sync ruff format --check
          llm_agent/demo
          llm_agent/demo_app.py
          llm_agent/application/audit
          llm_agent/infrastructure/audit
          llm_agent/api/http/audit_context.py
          llm_agent/api/http/v1/dto/demo_auth.py
          llm_agent/api/http/v1/routes/demo_auth.py
          llm_agent/infrastructure/mcp
          llm_agent/services/demo
          llm_agent/api/http/v1/dto/demo.py
          llm_agent/api/http/v1/routes/demo.py
          llm_agent/core/telemetry.py
          tests/fake_implementations/demo_mcp_client.py
          tests/unit/demo
          tests/thin_integration/demo
          automation

  tests:
    name: runtime and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen --no-sync pytest tests

  automation-tests:
    name: repository automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run repository automation tests
        run: uv run --frozen --no-sync pytest automation/tests

  container-smoke:
    name: production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Build production image
        run: docker build --target prod --tag movie-reservation-agent:ci .

      - name: Verify local deterministic workflow
        run: bash automation/container_smoke.sh movie-reservation-agent:ci

  publish-image:
    name: publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'movie-reservation-platform-lab/movie-reservation-agent'
    needs:
      - quality
      - tests
      - automation-tests
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Node.js for shared evidence tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Prepare canonical candidate
        id: candidate
        uses: movie-reservation-platform-lab/.github/actions/prepare-container-candidate@86d1eb043e057b9b709e10d3dc19d4ea35a4cbf7 # shared evidence v1alpha2
        with:
          component: reservation-agent

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish single-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./llm_agent
          target: prod
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.candidate.outputs.image_ref }}:${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.tag }}

      - name: Attest and publish security evidence
        uses: movie-reservation-platform-lab/.github/actions/container-evidence@86d1eb043e057b9b709e10d3dc19d4ea35a4cbf7 # shared evidence v1alpha2
        with:
          component: reservation-agent
          digest: ${{ steps.build.outputs.digest }}
          github-token: ${{ github.token }}
