[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"


[project]
name = "llm-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "authlib>=1.6.6",
    "backoff>=2.2.1",
    "fastapi>=0.115.12",
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.34.1",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-instrumentation-httpx>=0.57b0",
    "opentelemetry-sdk>=1.34.1",
    "piccolo[postgres]>=1.28.0",
    "pydantic-settings>=2.10.1",
    "structlog>=25.3.0",
    "svcs>=25.1.0",
    "uvicorn>=0.34.2",
    "websockets>=15.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_agent"]

[dependency-groups]
dev = [
    "ipython>=9.2.0",
    "pudb>=2025.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8,<1",
]

[tool.uv]
required-version = "==0.12.3"
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version="py312"
line-length=120
indent-width=4

# TODO
    #One important packaging gotcha (for later extraction)
    #Right now your wheel build includes only packages = ["llm_agent"] (from llm_agent/pyproject.toml).
    #So anything not under the llm_agent/llm_agent/ package tree won’t be shipped. Keeping contracts under llm_agent/contracts/...
    #avoids surprises and makes later extraction a mechanical move.
